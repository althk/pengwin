[package]
name = "ext4-core"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1"
zerocopy = { version = "0.7", features = ["derive"] }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Foundation",
    "Win32_Security",
] }

[features]
fixtures = []

[dev-dependencies]
tempfile = "3"
